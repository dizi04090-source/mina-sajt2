databases:
  - name: mina-db
    databaseName: mina
    user: mina
    plan: free

services:
  - type: web
    name: mina-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput && python manage.py seed
    startCommand: gunicorn mina_backend.wsgi:application
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: mina-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: mina-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
